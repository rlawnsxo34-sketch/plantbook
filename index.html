<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방장산 식물 도감</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- React & ReactDOM (가장 안정적인 CDN으로 교체) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-[#F4F8F5]">
  <div id="root">
    <div className="min-h-screen flex flex-col items-center justify-center text-emerald-600 gap-4">
      <i className="ph ph-spinner animate-spin text-5xl"></i>
      <p className="font-bold">도감을 준비하고 있어요...</p>
    </div>
  </div>

  <script type="module">
    // 파이어베이스 모듈 로드
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCZjnNVl9MkH2nqQ9O0vhKibiwGl-0ysRU",
      authDomain: "plant-book-84803.firebaseapp.com",
      projectId: "plant-book-84803",
      storageBucket: "plant-book-84803.firebasestorage.app",
      messagingSenderId: "76598088689",
      appId: "1:76598088689:web:334a3735566fa37c01aa50"
    };

    const app = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(app);
    window.firebaseDb = getFirestore(app);
    window.firebaseMethods = {
      signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
      collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc
    };
  </script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const auth = window.firebaseAuth;
      const db = window.firebaseDb;
      const { signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } = window.firebaseMethods;
      const appId = "plant-book-84803";

      const [user, setUser] = useState(null);
      const [currentTab, setCurrentTab] = useState('camera');
      
      const [selectedImage, setSelectedImage] = useState(null);
      const [compressedImageUrl, setCompressedImageUrl] = useState(null);
      
      // 위치(GPS) 상태
      const [location, setLocation] = useState(null);
      const [isLocating, setIsLocating] = useState(false);

      // 입력 폼 상태
      const [plantName, setPlantName] = useState('');
      const [plantDesc, setPlantDesc] = useState('');

      const cameraInputRef = useRef(null);
      const albumInputRef = useRef(null);

      const [plants, setPlants] = useState([]);
      const [isSaving, setIsSaving] = useState(false);
      const [saveSuccess, setSaveSuccess] = useState(false);
      const [expandedPlantId, setExpandedPlantId] = useState(null);
      const [error, setError] = useState(null);

      // 🌟 수정 기능 상태 추가
      const [editingPlantId, setEditingPlantId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editDesc, setEditDesc] = useState('');
      const [isUpdating, setIsUpdating] = useState(false);

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginId, setLoginId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const DUMMY_DOMAIN = "@plant.local"; 
      const [showImageSourceModal, setShowImageSourceModal] = useState(false);

      // 인앱 브라우저 감지 (카카오톡, 네이버 앱 등)
      const isInAppBrowser = /KAKAOTALK|NAVER|Instagram|Line|Daum/i.test(navigator.userAgent);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            setUser(currentUser);
          } else {
            setUser(null);
            try { await signInAnonymously(auth); } catch (err) { console.warn("익명 로그인 제한됨"); }
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const plantsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'plants');
        const unsubscribe = onSnapshot(plantsRef, (snapshot) => {
          const plantData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          plantData.sort((a, b) => b.createdAt - a.createdAt);
          setPlants(plantData);
        }, (err) => { console.error("도감 오류:", err); });
        return () => unsubscribe();
      }, [user]);

      const handleSignUp = async () => {
        if (!loginId || loginPassword.length < 6) return setAuthError("아이디와 6자리 이상 비밀번호를 입력해주세요.");
        try {
          const fakeEmail = `${loginId}${DUMMY_DOMAIN}`;
          await createUserWithEmailAndPassword(auth, fakeEmail, loginPassword);
          setShowLoginModal(false); setLoginId(''); setLoginPassword('');
        } catch (err) { setAuthError("가입에 실패했습니다."); }
      };

      const handleLogin = async () => {
        if (!loginId || loginPassword.length < 6) return setAuthError("입력을 확인해주세요.");
        try {
          await signInWithEmailAndPassword(auth, `${loginId}${DUMMY_DOMAIN}`, loginPassword);
          setShowLoginModal(false); setLoginId(''); setLoginPassword('');
        } catch (err) { setAuthError("정보가 틀렸습니다."); }
      };

      const handleLogout = async () => {
        try { await signOut(auth); await signInAnonymously(auth); } catch (err) {}
      };

      // 위치(GPS) 수집 함수
      const fetchLocation = () => {
        if ("geolocation" in navigator) {
          setIsLocating(true);
          navigator.geolocation.getCurrentPosition(
            (position) => {
              setLocation({ lat: position.coords.latitude, lng: position.coords.longitude });
              setIsLocating(false);
            },
            (err) => {
              console.warn("위치 수집 실패:", err.message);
              setLocation(null);
              setIsLocating(false);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        } else {
          setLocation(null);
          setIsLocating(false);
        }
      };

      // 이미지 압축 (도감 저장용량 최적화)
      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let { width, height } = img;
              if (width > height && width > 600) { height *= 600 / width; width = 600; } 
              else if (height > 600) { width *= 600 / height; height = 600; }
              canvas.width = width; canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.7)); 
            };
          };
        });
      };

      const handleImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          if (selectedImage) URL.revokeObjectURL(selectedImage);
          
          setSelectedImage(URL.createObjectURL(file));
          setSaveSuccess(false);
          setPlantName(''); 
          setPlantDesc('');
          setError(null);
          setLocation(null);
          
          fetchLocation(); // 사진 등록 시 자동으로 위치 탐색 시작

          const compressedDataUrl = await compressImage(file);
          setCompressedImageUrl(compressedDataUrl);
        }
      };

      // 네이버 렌즈 열기
      const openNaverLens = () => {
        window.open('https://m.naver.com', '_blank');
      };

      // 도감 데이터 파이어베이스에 저장
      const saveToDictionary = async () => {
        if (!user) {
          setError("도감에 저장하려면 먼저 우측 상단의 [로그인]을 진행해주세요!");
          setShowLoginModal(true);
          return;
        }
        
        if (!plantName.trim()) {
          setError("식물 이름을 꼭 적어주세요!");
          return;
        }
        if (!compressedImageUrl || isSaving) return; 
        
        setIsSaving(true);
        setError(null);

        try {
          const plantsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'plants');
          const plantData = {
            name: plantName.trim(),
            description: plantDesc.trim() || "네이버 렌즈로 찾은 식물입니다.",
            imageData: compressedImageUrl,
            createdAt: Date.now()
          };

          if (location) {
            plantData.location = location;
          }

          await addDoc(plantsRef, plantData);
          setSaveSuccess(true);
        } catch (err) { 
          setError("저장에 실패했습니다. 네트워크를 확인해주세요."); 
        } finally { 
          setIsSaving(false); 
        }
      };

      const deletePlant = async (id) => {
        if (!user) return;
        try { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'plants', id)); } catch (err) {}
      };

      // 🌟 도감 수정 시작
      const startEditPlant = (plant, e) => {
        e.stopPropagation(); // 카드 클릭 이벤트와 겹치지 않게 방지
        setEditingPlantId(plant.id);
        setEditName(plant.name);
        setEditDesc(plant.description || '');
        setExpandedPlantId(plant.id); // 내용도 자동으로 펼쳐줌
      };

      // 🌟 도감 수정 취소
      const cancelEdit = () => {
        setEditingPlantId(null);
        setEditName('');
        setEditDesc('');
      };

      // 🌟 수정한 정보 서버에 저장
      const saveEditPlant = async (id) => {
        if (!user || !editName.trim()) {
          setError("식물 이름을 입력해야 수정할 수 있습니다.");
          return;
        }
        setIsUpdating(true);
        try {
          const plantDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'plants', id);
          await updateDoc(plantDoc, {
            name: editName.trim(),
            description: editDesc.trim()
          });
          setEditingPlantId(null);
          setError(null);
        } catch (err) {
          setError("수정에 실패했습니다. 네트워크를 확인해주세요.");
        } finally {
          setIsUpdating(false);
        }
      };

      const resetApp = () => {
        if (selectedImage) URL.revokeObjectURL(selectedImage); 
        setSelectedImage(null); setCompressedImageUrl(null); setSaveSuccess(false);
        setPlantName(''); setPlantDesc(''); setError(null); setLocation(null); setIsLocating(false);
        cancelEdit(); // 리셋 시 수정 상태도 초기화
        if (cameraInputRef.current) cameraInputRef.current.value = "";
        if (albumInputRef.current) albumInputRef.current.value = "";
      };

      const handleModalBackgroundClick = (e) => {
        if (e.target === e.currentTarget) {
          setShowImageSourceModal(false);
        }
      };

      const togglePlantDetail = (id) => {
        setExpandedPlantId(prevId => {
          if (prevId === id) {
            cancelEdit(); // 🌟 아코디언(내용)을 닫을 때 작성 중이던 수정 데이터도 안전하게 초기화
            return null;
          }
          return id;
        });
      };

      return (
        <div className="min-h-screen bg-[#F4F8F5] text-slate-800 font-sans selection:bg-emerald-200 pb-28">
          
          {isInAppBrowser && (
            <div className="bg-amber-100 text-amber-800 px-4 py-2.5 text-xs font-bold text-center leading-relaxed border-b border-amber-200 animate-in slide-in-from-top-2">
              💡 카카오톡 등에서는 카메라가 원활하지 않을 수 있습니다.<br/>메뉴(⋮)에서 <span className="text-amber-900 underline">다른 브라우저로 열기</span>를 선택해주세요!
            </div>
          )}

          <header className="bg-white/80 backdrop-blur-md shadow-sm px-5 py-3 sticky top-0 z-10 border-b border-slate-100">
            <div className="max-w-md mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center">
                <img src="국립장성숲체원-_국문좌우_이미지형 (1).png" alt="국립장성숲체원 로고" className="h-10 object-contain drop-shadow-sm" />
              </div>
              
              {user && !user.isAnonymous ? (
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-100">
                    {user.email?.split('@')[0]}님
                  </span>
                  <button onClick={handleLogout} className="flex items-center gap-1.5 text-xs bg-white hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-full font-semibold transition-colors border border-slate-200 shadow-sm">
                    <i className="ph ph-sign-out text-sm"></i> 로그아웃
                  </button>
                </div>
              ) : (
                <button onClick={() => { setShowLoginModal(true); setAuthError(''); }} className="flex items-center gap-1.5 text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-full font-semibold transition-all shadow-md shadow-emerald-600/20">
                  <i className="ph ph-sign-in text-sm"></i> 로그인
                </button>
              )}
            </div>
          </header>

          <main className="max-w-md mx-auto p-5 mt-2">
            {currentTab === 'camera' && (
              <div className="flex flex-col gap-6 animate-in fade-in duration-500">
                {!selectedImage && (
                  <div className="text-center space-y-4 py-6 relative">
                    <div className="relative inline-block">
                      <div className="absolute inset-0 bg-emerald-300 blur-3xl opacity-20 rounded-full transform scale-150"></div>
                      <img src="01.관찰포이_봄.png" alt="관찰하는 포이" className="w-40 h-40 mx-auto relative z-10 drop-shadow-xl animate-bounce" style={{ animationDuration: '3s' }} />
                    </div>
                    <div>
                      <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight">식물을 발견했나요?</h2>
                      <p className="text-slate-500 mt-1.5 text-sm font-medium">사진을 찍고 이름을 기록해보세요!</p>
                    </div>
                  </div>
                )}

                {error && (
                  <div className="bg-amber-50 text-amber-700 p-4 rounded-2xl flex items-start gap-3 border border-amber-200 shadow-sm animate-in fade-in">
                    <i className="ph ph-warning-circle text-xl shrink-0 mt-0.5"></i>
                    <p className="text-sm font-bold leading-relaxed break-keep">{error}</p>
                  </div>
                )}

                <div className="bg-white p-2.5 rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                  {!selectedImage ? (
                    <div onClick={() => setShowImageSourceModal(true)} className="border-2 border-dashed border-emerald-200 bg-emerald-50/30 rounded-[1.5rem] h-80 flex flex-col items-center justify-center gap-5 cursor-pointer hover:bg-emerald-50 active:scale-[0.98] transition-all group">
                      <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-sm text-emerald-500 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300">
                        <i className="ph ph-camera text-3xl"></i>
                      </div>
                      <div className="text-center">
                        <span className="block text-lg font-bold text-emerald-900 mb-1">카메라 켜기 / 앨범 선택</span>
                        <span className="text-sm text-emerald-600/70 font-medium">여기를 가볍게 터치하세요</span>
                      </div>
                    </div>
                  ) : (
                    <div className="relative rounded-[1.5rem] overflow-hidden shadow-inner">
                      <img src={selectedImage} alt="Selected Plant" className="w-full h-80 object-cover" />
                      
                      {/* 위치 정보 상태 표시 */}
                      <div className="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                        {isLocating ? (
                          <><i className="ph ph-spinner animate-spin text-white"></i><span className="text-white text-xs font-bold">위치 찾는 중...</span></>
                        ) : location ? (
                          <><i className="ph ph-map-pin text-emerald-400"></i><span className="text-white text-xs font-bold">위치 기록 완료</span></>
                        ) : (
                          <><i className="ph ph-map-pin-line text-slate-400"></i><span className="text-slate-300 text-xs font-bold">위치 정보 없음</span></>
                        )}
                      </div>
                    </div>
                  )}
                  <input type="file" accept="image/*" capture="environment" onChange={handleImageChange} ref={cameraInputRef} className="hidden" />
                  <input type="file" accept="image/*" onChange={handleImageChange} ref={albumInputRef} className="hidden" />
                </div>

                {selectedImage && (
                  <div className="animate-in slide-in-from-bottom-4 space-y-6">
                    
                    {/* 네이버 렌즈 안내 */}
                    <div className="bg-slate-50 p-5 rounded-3xl border border-slate-200 space-y-3 shadow-inner">
                      <div className="flex items-center gap-2 text-slate-800 font-black text-lg">
                        <i className="ph ph-scan text-2xl text-[#03C75A]"></i> 이름이 궁금하다면?
                      </div>
                      <p className="text-sm text-slate-600 font-medium leading-relaxed break-keep">
                        아래 버튼을 눌러 네이버를 열고, <strong>그린닷</strong>의 <strong>렌즈</strong>로 사진을 검색해보세요!
                      </p>
                      <button 
                        onClick={openNaverLens} 
                        className="w-full py-4 bg-[#03C75A] text-white font-black rounded-xl hover:bg-[#02b351] active:bg-[#029a46] shadow-md shadow-[#03C75A]/20 flex items-center justify-center gap-2 transition-all mt-1"
                      >
                        네이버 렌즈로 이름 찾기
                      </button>
                    </div>

                    {/* 기록 박스 */}
                    <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-emerald-200 space-y-4 relative">
                      <div className="inline-block px-3.5 py-1 bg-emerald-100 text-emerald-800 text-[11px] font-black rounded-full mb-1 tracking-wide">
                        기록하기 ✍️
                      </div>

                      <div className="space-y-4">
                        <div>
                          <label className="text-xs font-bold text-slate-600 pl-1 block mb-1">식물 이름 (필수)</label>
                          <input 
                            type="text" 
                            placeholder="찾아낸 식물 이름을 적어주세요" 
                            value={plantName} 
                            onChange={(e) => { setPlantName(e.target.value); setError(null); }} 
                            className="w-full px-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 font-bold text-slate-800 outline-none focus:border-emerald-500 focus:bg-white transition-colors" 
                          />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-slate-600 pl-1 block mb-1">특징 메모 (선택)</label>
                          <textarea 
                            placeholder="이 식물의 특징이나 느낀 점을 적어보세요" 
                            value={plantDesc} 
                            onChange={(e) => setPlantDesc(e.target.value)} 
                            className="w-full px-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 font-medium text-slate-700 outline-none focus:border-emerald-500 focus:bg-white transition-colors resize-none h-24" 
                          />
                        </div>
                      </div>
                    </div>

                    <div className="flex gap-3 pt-2">
                      <button onClick={resetApp} className="flex-1 py-4 bg-white border border-slate-200 text-slate-700 font-bold rounded-2xl flex items-center justify-center gap-2 hover:bg-slate-50 shadow-sm transition-all">
                        <i className="ph ph-arrows-clockwise text-xl"></i> 다시
                      </button>
                      
                      {saveSuccess ? (
                        <button disabled className="flex-[2] py-4 bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold rounded-2xl flex items-center justify-center gap-2 cursor-not-allowed">
                          <i className="ph ph-check-circle text-xl"></i> 저장 완료!
                        </button>
                      ) : (
                        <button 
                          onClick={saveToDictionary} 
                          disabled={isSaving || !plantName.trim()} 
                          className="flex-[2] py-4 bg-slate-800 text-white font-bold rounded-2xl hover:bg-slate-900 active:bg-black shadow-lg flex items-center justify-center gap-2 disabled:opacity-50 transition-all"
                        >
                          {isSaving ? <i className="ph ph-spinner animate-spin text-xl"></i> : <i className="ph ph-floppy-disk text-xl"></i>}
                          내 도감에 저장
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {currentTab === 'dictionary' && (
              <div className="animate-in fade-in duration-300">
                <div className="flex items-center justify-between mb-6">
                  <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2.5">
                    <i className="ph ph-book-open text-3xl text-emerald-600"></i> 나의 식물 기록
                  </h2>
                  <span className="text-sm bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold shadow-sm">
                    총 {plants.length}개
                  </span>
                </div>

                {plants.length === 0 ? (
                  <div className="text-center py-20 bg-white rounded-[2rem] border border-dashed border-emerald-200 shadow-sm relative overflow-hidden">
                    <div className="absolute inset-0 bg-emerald-50/30"></div>
                    <img src="01.관찰포이_봄.png" alt="관찰하는 포이" className="w-32 h-32 mx-auto relative z-10 drop-shadow-md opacity-80 mb-4" />
                    <p className="text-slate-700 font-bold text-lg relative z-10">아직 수집한 식물이 없어요.</p>
                    <p className="text-slate-500 text-sm mt-1.5 font-medium relative z-10">카메라로 식물을 찍고 도감을 채워보세요!</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {plants.map((plant) => (
                      <div key={plant.id} className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col group transition-all">
                        <div className="relative h-48 cursor-pointer" onClick={() => togglePlantDetail(plant.id)}>
                          <img src={plant.imageData} alt={plant.name} className="w-full h-full object-cover bg-slate-100" />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                          
                          <div className="absolute bottom-0 left-0 right-0 p-4 text-white">
                            <h4 className="font-extrabold text-lg flex items-center justify-between">
                              {plant.name}
                              <i className={`ph ph-caret-${expandedPlantId === plant.id ? 'up' : 'down'} text-white/70`}></i>
                            </h4>
                            <p className="text-xs font-medium text-white/80 mt-1 flex items-center gap-1.5">
                              <i className="ph ph-calendar-blank"></i> {new Date(plant.createdAt).toLocaleDateString()}
                              {plant.location && <><span className="mx-1 opacity-50">|</span> <i className="ph ph-map-pin"></i> 위치 기록됨</>}
                            </p>
                          </div>

                          {/* 🌟 수정 및 삭제 버튼 영역 */}
                          <div className="absolute top-3 right-3 flex gap-2">
                            <button onClick={(e) => startEditPlant(plant, e)} className="p-2 bg-black/40 backdrop-blur-md text-white rounded-full hover:bg-emerald-500 transition-colors opacity-100 sm:opacity-0 sm:group-hover:opacity-100 shadow-sm">
                              <i className="ph ph-pencil-simple text-base"></i>
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); deletePlant(plant.id); }} className="p-2 bg-black/40 backdrop-blur-md text-white rounded-full hover:bg-red-500 transition-colors opacity-100 sm:opacity-0 sm:group-hover:opacity-100 shadow-sm">
                              <i className="ph ph-trash text-base"></i>
                            </button>
                          </div>
                        </div>

                        {expandedPlantId === plant.id && (
                          <div className="p-5 border-t border-slate-100 bg-slate-50/50 animate-in slide-in-from-top-2">
                            {/* 🌟 수정 모드일 때와 일반 보기 모드일 때를 구분 */}
                            {editingPlantId === plant.id ? (
                              <div className="space-y-3">
                                <input 
                                  type="text" 
                                  value={editName} 
                                  onChange={(e) => setEditName(e.target.value)} 
                                  className="w-full px-3 py-2 rounded-xl border border-emerald-200 bg-white font-bold text-slate-800 outline-none focus:border-emerald-500 transition-colors"
                                  placeholder="식물 이름"
                                />
                                <textarea 
                                  value={editDesc} 
                                  onChange={(e) => setEditDesc(e.target.value)} 
                                  className="w-full px-3 py-2 rounded-xl border border-emerald-200 bg-white font-medium text-slate-700 outline-none focus:border-emerald-500 transition-colors resize-none h-20"
                                  placeholder="특징 메모"
                                />
                                <div className="flex gap-2 pt-1">
                                  <button onClick={cancelEdit} className="flex-1 py-2.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition-colors text-sm">
                                    취소
                                  </button>
                                  <button onClick={() => saveEditPlant(plant.id)} disabled={isUpdating || !editName.trim()} className="flex-1 py-2.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-colors disabled:opacity-50 text-sm flex items-center justify-center gap-1.5 shadow-sm">
                                    {isUpdating ? <i className="ph ph-spinner animate-spin"></i> : <i className="ph ph-check"></i>}
                                    저장
                                  </button>
                                </div>
                              </div>
                            ) : (
                              <>
                                <p className="text-slate-700 font-medium text-sm leading-relaxed mb-4 whitespace-pre-wrap">
                                  {plant.description}
                                </p>
                                
                                {/* 지도 표시 영역 */}
                                {plant.location ? (
                                  <div className="rounded-2xl overflow-hidden border border-slate-200 h-40 relative shadow-sm">
                                    <iframe
                                      width="100%"
                                      height="100%"
                                      frameBorder="0"
                                      style={{ border: 0 }}
                                      src={`https://maps.google.com/maps?q=${plant.location.lat},${plant.location.lng}&z=16&output=embed`}
                                      allowFullScreen
                                    ></iframe>
                                    <div className="absolute inset-0 bg-transparent pointer-events-none"></div>
                                    <div className="absolute bottom-2 right-2 bg-white/90 backdrop-blur px-2.5 py-1 rounded-lg text-[10px] font-bold text-slate-600 shadow-sm border border-slate-100 flex items-center gap-1">
                                      <i className="ph ph-map-pin-fill text-emerald-500"></i> 발견 위치
                                    </div>
                                  </div>
                                ) : (
                                  <div className="rounded-2xl bg-slate-100 border border-slate-200 border-dashed h-16 flex items-center justify-center text-slate-400 text-xs font-bold gap-1.5">
                                    <i className="ph ph-map-pin-slash text-base"></i> 위치 정보가 없어요
                                  </div>
                                )}
                              </>
                            )}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-slate-200 pb-safe z-20">
            <div className="max-w-md mx-auto flex">
              <button onClick={() => setCurrentTab('camera')} className={`flex-1 py-4 flex flex-col items-center gap-1.5 transition-colors relative ${currentTab === 'camera' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                {currentTab === 'camera' && <div className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-1 bg-emerald-500 rounded-b-full"></div>}
                <i className={`ph ph-camera text-2xl ${currentTab === 'camera' ? 'fill-emerald-50' : ''}`}></i>
                <span className="text-[11px] font-bold tracking-wide">사진 찍기</span>
              </button>
              <button onClick={() => { setCurrentTab('dictionary'); resetApp(); }} className={`flex-1 py-4 flex flex-col items-center gap-1.5 transition-colors relative ${currentTab === 'dictionary' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                {currentTab === 'dictionary' && <div className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-1 bg-emerald-500 rounded-b-full"></div>}
                <i className={`ph ph-book-open text-2xl ${currentTab === 'dictionary' ? 'fill-emerald-50' : ''}`}></i>
                <span className="text-[11px] font-bold tracking-wide">내 도감</span>
              </button>
            </div>
          </nav>

          {showImageSourceModal && (
            <div 
              className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-5"
              onClick={handleModalBackgroundClick}
            >
              <div className="bg-white rounded-t-[2rem] sm:rounded-[2.5rem] w-full max-w-sm p-6 space-y-4 shadow-2xl animate-in slide-in-from-bottom-10 sm:zoom-in-95 duration-200 pb-safe">
                <div className="text-center mb-4">
                  <h3 className="text-xl font-black text-slate-800">사진 가져오기</h3>
                  <p className="text-sm text-slate-500 font-medium mt-1">어떤 방법으로 식물 사진을 올릴까요?</p>
                </div>
                <button onClick={() => { cameraInputRef.current?.click(); setShowImageSourceModal(false); }} className="w-full py-4 bg-emerald-50 text-emerald-700 font-bold rounded-2xl flex items-center justify-center gap-3 hover:bg-emerald-100 border border-emerald-100">
                  <i className="ph ph-camera text-2xl"></i> 카메라로 직접 찍기
                </button>
                <button onClick={() => { albumInputRef.current?.click(); setShowImageSourceModal(false); }} className="w-full py-4 bg-slate-50 text-slate-700 font-bold rounded-2xl flex items-center justify-center gap-3 hover:bg-slate-100 border border-slate-200">
                  <i className="ph ph-images text-2xl"></i> 휴대폰 앨범에서 선택
                </button>
                <button onClick={() => setShowImageSourceModal(false)} className="w-full py-4 text-slate-400 font-bold rounded-2xl hover:bg-slate-50 mt-2">취소</button>
              </div>
            </div>
          )}

          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-5">
              <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-7 space-y-6 shadow-2xl">
                <div className="text-center">
                  <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i className="ph ph-leaf text-3xl"></i>
                  </div>
                  <h3 className="text-2xl font-black text-slate-800 tracking-tight">도감 시작하기</h3>
                  <p className="text-sm text-slate-500 mt-2 font-medium break-keep">아이디와 비밀번호만으로 간편하게 도감을 보관하세요!</p>
                </div>
                <div className="space-y-3.5">
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-600 pl-1">아이디</label>
                    <input type="text" placeholder="영문, 숫자 입력" value={loginId} onChange={(e) => setLoginId(e.target.value)} className="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 font-medium outline-none focus:border-emerald-500" />
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-600 pl-1">비밀번호</label>
                    <input type="password" placeholder="6자리 이상 입력" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 font-medium outline-none focus:border-emerald-500" />
                  </div>
                  {authError && <p className="text-red-500 text-xs px-2 font-bold">{authError}</p>}
                </div>
                <div className="flex flex-col gap-2.5 pt-2">
                  <div className="flex gap-2.5">
                    <button onClick={handleSignUp} className="flex-1 py-3.5 bg-emerald-50 text-emerald-700 font-black rounded-2xl hover:bg-emerald-100">새로 가입</button>
                    <button onClick={handleLogin} className="flex-1 py-3.5 bg-emerald-600 text-white font-black rounded-2xl hover:bg-emerald-700 shadow-lg">로그인</button>
                  </div>
                  <button onClick={() => setShowLoginModal(false)} className="w-full py-3.5 bg-white text-slate-400 font-bold rounded-2xl hover:bg-slate-50">닫기</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 💡 해결: 파이어베이스가 완벽하게 준비되었는지 확인한 뒤에만 화면을 그리도록 변경
    const checkFirebaseAndStart = () => {
      if (window.firebaseAuth && window.firebaseMethods) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      } else {
        setTimeout(checkFirebaseAndStart, 50); // 0.05초마다 준비됐는지 확인
      }
    };
    
    // 문서 로드가 끝나면 바로 실행
    checkFirebaseAndStart();
  </script>
</body>
</html>
